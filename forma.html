<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniView — Вхід</title>
</head>
<body>
<section>
    <h2>Опитування</h2>

    <form>
        <p>Скільки фам років?</p>

        <input type="radio" name="age" value="Дитинство">
        <label>1-16</label><br>

        <input type="radio" name="age" value="Підлітковий вік">
        <label>17-21</label><br>

        <input type="radio" name="age value="Дорослий вік">
        <label>22-40</label><br>

        <input type="radio" name="age" value="Похилий вік">
        <label>41-99+</label><br>

        <button>Відправити</button>
    </form>
</section>

<section>
    <h2>Опитування</h2>

    <form>
        <p>Який жанр аніме вам подобається найбільше?</p>

        <input type="checkbox" name="genre" value="action">
        <label>Екшен</label><br>

        <input type="checkbox" name="genre" value="comedy">
        <label>Комедія</label><br>

        <input type="checkbox" name="genre" value="romance">
        <label>Романтика</label><br>

        <input type="checkbox" name="genre" value="fantasy">
        <label>Фентезі</label><br>

        <button>Відправити</button>
    </form>
</section>

</body>
</html>
